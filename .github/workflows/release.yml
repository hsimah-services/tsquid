name: Release

# Publishes each package version not yet on npm, via trusted publishing (OIDC: no
# token, no 2FA; provenance is automatic). Runs when a version bump lands on main,
# or manually from the Actions tab. npm accepts only this workflow in the `npm`
# environment, which deploys from main only.
on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - uses: pnpm/action-setup@v6
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm release
