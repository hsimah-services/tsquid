# tsquid repo map. Terse; update alongside the code.

about:
  what: opinionated React framework on strongly typed route context
  stack: React 19, React Router 8, Relay 21, Astryx 0.6 (theme-neutral), StyleX 0.19, Vite 8
  npm: "@tsquid/{routes,codegen,vite,eslint-plugin}; 0.1.0 published 2026-09-27"

layout:
  Cargo.toml: cargo workspace, crates/*
  package.json: pnpm root; scripts test, routes, release; devDep @tsquid/codegen (for routes)
  pnpm-workspace.yaml: packages/*, templates/*; allowBuilds astryx
  tsconfig.base.json: shared compiler options
  README.md / AGENTS.md / CLAUDE.md: overview / agent rules / imports AGENTS.md

  crates/:
    tsquid-codegen/:
      src/lib.rs: generate_json(&str) -> Result<String, String>; validation; unit tests
      tests: include_str! fixtures from packages/routes/tests
    tsquid-codegen-wasm/:
      what: cdylib, wasm32-unknown-unknown, no I/O
      abi: alloc, dealloc, generate(ptr,len) -> 1|0, result_ptr, result_len

  packages/:
    routes/:
      runtime/: uri.ts (createURI), context.tsx (registry), entrypoint.tsx (defineRoute, RouteEntryPoint, preloadEntryPoint, resource), Link.tsx (createLink)
      publish: dist/ via tsconfig.build.json on prepack; publishConfig.exports
      imports: relative, .js extensions
      tests/: routes.json + routes.generated.ts (fixture), types.ts (tsc), run.mjs -> runtime.test.mjs
    codegen/:
      index.mjs: generate(); instantiates dist/tsquid-codegen.wasm once
      bin/tsquid-codegen.mjs: CONFIG OUTPUT [--check]
      build: cargo build tsquid-codegen-wasm -> dist/ (gitignored); runs in test + prepack
      test/: fixture parity, errors, CLI
    vite/:
      index.mjs: tsquid() = stylex -> react -> relay + dedupe + global shim
    eslint-plugin/:
      src/: index.mjs (configs.recommended), rules.mjs, check-architecture.mjs
      bin/: tsquid-check-architecture (src/components graph)
      docs/ui-standards.md: the UI standards
      test/: RuleTester + architecture
    shared: Apache-2.0, repository.directory, public access, files[], LICENSE symlink (pack resolves)

  templates/:
    app/:
      what: starter; workspace member (CI runs its check); copied by create-app.sh
      routes: Home (/) static, Profile (/me) + ProfileQuery
      schema.graphql: placeholder
      src/: app/ (providers, router, AppLink), relay/, routes/ (+ __generated__), components/{navigation,home,profile}
      docker: node 22 + pnpm
      scripts/: toolchain.sh (TOOLCHAIN_PUBLISH), dev.sh, fetch-schema.mjs
      AGENTS.md: tsquid rules + generated ASTRYX block
      no pnpm-workspace.yaml: would split the workspace; create-app writes one

  scripts/:
    toolchain.sh: container runner (image tsquid-toolchain:2)
    create-app.sh: copy starter, pin ^versions, rename
    publish.mjs: "[--dry-run] pack + publish versions not on npm"
  .docker/Dockerfile: rust:1 + wasm32 target + node 22 + npm + pnpm 12.4.1
  .github/workflows/:
    check.yml: cargo test; pnpm test; starter routes:check
    release.yml: manual, main only, trusted publishing

commands: # via scripts/toolchain.sh
  test: cargo test --locked && pnpm test
  install: pnpm install --frozen-lockfile
  routes: pnpm routes (fixture + starter)
  publish-dry-run: node scripts/publish.mjs --dry-run
  new-app: scripts/create-app.sh ../my-app (host)

conventions:
  generated-output: committed
  typescript: typescript = TS6 (JS API); "@typescript/native" = TS7 (tsc)
  caches: $XDG_CACHE_HOME/tsquid/{pnpm-store,cargo}
  container:
    - pnpm 12 reads pnpm_config_*, not npm_config_*
    - HOME=/tmp; COREPACK_HOME + XDG_DATA_HOME pinned in image

